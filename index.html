<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平台报税向导 Platform Tax Guide</title>
<style>
  :root{
    color-scheme: light;
    --page:#edf0f5;        /* 页面底：浅灰蓝，让白色卡片浮起来 */
    --page-2:#f4f6fa;      /* 次级分区底 */
    --card:#ffffff;
    --ink-1:#141b28;
    --ink-2:#4b5567;
    --ink-3:#8791a4;
    --hairline:#e3e8f0;
    --series-1:#2a78d6;
    --series-2:#eb6834;
    --st-good:#0ca30c;
    --st-warn:#fab219;
    --st-serious:#ec835a;
    --st-crit:#d03b3b;
    --tint-1:rgba(42,120,214,.09);
    --tint-2:rgba(75,85,103,.09);
    --tint-orange:rgba(235,104,52,.11);
    --tint-good:rgba(12,163,12,.10);
    --tint-warn:rgba(250,178,25,.16);
    --tint-serious:rgba(236,131,90,.14);
    --tint-crit:rgba(208,59,59,.10);
    --navy-1:#0c1a2f;
    --navy-2:#17345c;
    --shadow:0 1px 2px rgba(19,26,38,.05),0 4px 16px rgba(19,26,38,.06);
    --shadow-lg:0 16px 40px rgba(19,26,38,.18);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --page:#0a0d13;
      --page-2:#10151f;
      --card:#161d29;
      --ink-1:#eef2f8;
      --ink-2:#b7c1d0;
      --ink-3:#7d889d;
      --hairline:#253045;
      --series-1:#3987e5;
      --series-2:#d95926;
      --tint-1:rgba(57,135,229,.16);
      --tint-2:rgba(183,193,208,.13);
      --tint-orange:rgba(217,89,38,.16);
      --tint-good:rgba(12,163,12,.16);
      --tint-warn:rgba(250,178,25,.16);
      --tint-serious:rgba(236,131,90,.16);
      --tint-crit:rgba(208,59,59,.16);
      --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
      --shadow-lg:0 16px 40px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--page);
    color:var(--ink-1);line-height:1.65;
    min-height:100vh;display:flex;flex-direction:column;
  }
  a{color:var(--series-1)}
  /* ---------- 顶栏 ---------- */
  header.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline)}
  @media (prefers-color-scheme: dark){ header.topbar{background:rgba(10,13,19,.82)} }
  .topbar-inner{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--series-1),#1d5aa8);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand{font-size:16px;font-weight:700}
  .brand small{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
  /* ---------- 通用按钮 ---------- */
  button.btn{border:none;border-radius:11px;padding:12px 26px;font-size:15px;font-weight:600;cursor:pointer;background:var(--series-1);color:#fff;transition:filter .15s,transform .15s}
  button.btn:hover:not(:disabled){filter:brightness(1.07)}
  button.btn:disabled{opacity:.35;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--series-1);outline-offset:2px}
  button.btn.ghost{background:transparent;border:1.5px solid var(--hairline);color:var(--ink-1);font-weight:500}
  button.btn.small{padding:9px 16px;font-size:13.5px}
  /* ---------- 首页 hero（深色横幅） ---------- */
  .hero{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--navy-1),var(--navy-2) 70%,#1b4370);color:#fff;padding:64px 20px 52px}
  .hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(720px 380px at 78% 12%,#000 0%,transparent 72%);mask-image:radial-gradient(720px 380px at 78% 12%,#000 0%,transparent 72%)}
  .hero::after{content:"";position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(57,135,229,.4),transparent 65%)}
  .hero-inner{max-width:1080px;margin:0 auto;position:relative;z-index:1}
  .hero-kicker{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.1em;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 15px;margin-bottom:18px}
  .hero h1{font-size:38px;line-height:1.32;margin:0 0 12px;color:#fff;letter-spacing:-.01em;font-weight:800}
  .hero-sub{font-size:15px;line-height:1.8;color:rgba(255,255,255,.78);max-width:600px;margin-bottom:24px}
  .hero-cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  button.btn-big{background:#fff;color:var(--navy-1);padding:14px 32px;font-size:16px;font-weight:700;border-radius:13px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
  button.btn-big:hover:not(:disabled){transform:translateY(-1px);filter:none}
  .hero-hint{font-size:12.5px;color:rgba(255,255,255,.62)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .stat{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--hairline);border-radius:15px;padding:16px 18px;box-shadow:var(--shadow)}
  .s-ico{width:42px;height:42px;border-radius:12px;background:var(--tint-1);font-size:21px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .s-num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
  .s-cap{font-size:12px;color:var(--ink-2);line-height:1.5}
  /* ---------- 分区横带 ---------- */
  .band{padding:46px 20px;background:var(--page)}
  .band-tint{background:var(--page-2);border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
  .band-dark{background:linear-gradient(150deg,var(--navy-1),var(--navy-2));color:#fff}
  .band-inner{max-width:1080px;margin:0 auto}
  .band-head{display:flex;align-items:baseline;gap:12px;margin-bottom:24px}
  .band-num{font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--series-1);font-variant-numeric:tabular-nums}
  .band-head h2{font-size:22px;font-weight:800;margin:0}
  .band-head em{font-style:normal;font-size:12.5px;color:var(--ink-3)}
  .band-dark .band-head h2{color:#fff}
  .band-dark .band-num{color:#6ea8ec}
  .band-foot{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:22px;line-height:1.7}
  /* ---------- 步骤卡 ---------- */
  .steps-h{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .sh{background:var(--card);border:1px solid var(--hairline);border-radius:15px;padding:20px 16px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;position:relative}
  .sh-num{position:absolute;top:-11px;left:16px;background:var(--series-1);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:2.5px 11px;letter-spacing:.06em}
  .sh b{font-size:15px}
  .sh small{font-size:12px;color:var(--ink-3);line-height:1.5}
  /* ---------- 案例卡 ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .case-card{background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;gap:13px}
  .case-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .cc-top{display:flex;align-items:center;justify-content:space-between}
  .cc-ico{width:46px;height:46px;border-radius:13px;background:var(--tint-1);font-size:23px;display:flex;align-items:center;justify-content:center}
  .cc-arrow{color:var(--ink-3);font-size:17px;transition:transform .15s,color .15s}
  .case-card:hover .cc-arrow{color:var(--series-1);transform:translateX(3px)}
  .cc-head{font-size:15.5px;font-weight:700;line-height:1.45}
  .cc-body p{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.6}
  .cc-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:12px;border-top:1px dashed var(--hairline)}
  .cc-tag{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .cc-amt{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
  .case-foot{font-size:13px;color:var(--ink-3);margin-top:16px}
  .case-foot a{cursor:pointer;font-weight:600}
  /* ---------- 政策要点带（深色） ---------- */
  .policy-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .ps{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:15px 16px}
  .ps b{display:block;font-size:14px;color:#fff;margin-bottom:5px}
  .ps span{font-size:12px;color:rgba(255,255,255,.66);line-height:1.6;display:block}
  /* ---------- 页面容器（问询/数据/结果） ---------- */
  .page-pad{padding:28px 20px 64px}
  .page-col{max-width:860px;margin:0 auto}
  .case-banner{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:14px;background:var(--card);border:1px solid var(--hairline);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow)}
  .case-banner b{color:var(--ink-1)}
  .case-banner a{cursor:pointer;margin-left:auto;font-size:12.5px}
  .rpt-head{margin-bottom:16px}
  .data-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
  .data-head h2{font-size:21px;margin:0}
  .data-sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .sec-ico{width:40px;height:40px;border-radius:12px;background:var(--tint-1);color:var(--series-1);font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  /* ---------- 问询页 ---------- */
  .q-head{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:0 2px}
  .q-count{font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
  .q-pct{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .pbar{height:6px;border-radius:3px;background:var(--hairline);flex:1;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--series-1);border-radius:3px;transition:width .25s}
  .card{background:var(--card);border:1px solid var(--hairline);border-radius:18px;padding:30px;animation:fadein .25s ease;box-shadow:var(--shadow)}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:3.5px 11px}
  .tag-blue{color:var(--series-1);background:var(--tint-1)}
  .tag-orange{color:var(--series-2);background:var(--tint-orange)}
  .question{font-size:21px;font-weight:700;line-height:1.55;margin:14px 0 6px}
  .q-tip{font-size:12.5px;color:var(--ink-3);margin-bottom:18px}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;border:1.5px solid var(--hairline);border-radius:13px;padding:15px 18px;background:var(--page-2);cursor:pointer;font-size:15px;text-align:left;color:var(--ink-1);transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--series-1)}
  .opt .key{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--hairline);font-size:13.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card);transition:all .15s}
  .opt .txt{flex:1}
  .opt .ck{color:var(--series-1);font-weight:700;opacity:0;transition:opacity .15s}
  .opt.sel{border-color:var(--series-1);background:var(--tint-1)}
  .opt.sel .key{background:var(--series-1);border-color:var(--series-1);color:#fff}
  .opt.sel .ck{opacity:1}
  .nav{display:flex;gap:12px;margin-top:24px}
  .nav .spacer{flex:1}
  /* ---------- 数据页 ---------- */
  .fields2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
  .field label em{font-style:normal;font-weight:400;color:var(--ink-3);font-size:12px}
  .fwrap{position:relative}
  .fwrap input{width:100%;padding:13px 74px 13px 15px;border:1.5px solid var(--hairline);border-radius:12px;font-size:16px;background:var(--page-2);color:var(--ink-1);outline:none;transition:border-color .15s;font-variant-numeric:tabular-nums}
  .fwrap input:focus{border-color:var(--series-1);box-shadow:0 0 0 3px var(--tint-1)}
  .funit{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px;pointer-events:none}
  .field .hint{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.6}
  /* ---------- 结果页：判定横幅 + 编号分区卡 ---------- */
  .verdict{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--hairline);border-left:6px solid var(--vc);background:var(--vbg);border-radius:16px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
  .v-ico{font-size:26px;line-height:1.3;flex-shrink:0}
  .verdict h3{font-size:18px;margin-bottom:4px}
  .verdict p{font-size:13.5px;color:var(--ink-2);line-height:1.65}
  .vcard{background:var(--card);border:1px solid var(--hairline);border-radius:18px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;animation:fadein .25s ease}
  .vcard-head{display:flex;align-items:center;gap:10px;padding:15px 22px;border-bottom:1px solid var(--hairline);background:var(--page-2)}
  .vcard-num{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--series-1);font-variant-numeric:tabular-nums}
  .vcard-head h2{font-size:16.5px;margin:0}
  .h2-ico{margin-right:8px}
  .vcard-body{padding:20px 22px}
  .note{font-size:13px;color:var(--ink-2);background:var(--page-2);border:1px solid var(--hairline);border-radius:12px;padding:12px 16px;margin:0 0 16px;line-height:1.7}
  .note b{color:var(--ink-1)}
  .basis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
  .basis-card{background:var(--page-2);border:1px solid var(--hairline);border-radius:12px;padding:12px 14px}
  .bc-q{font-size:12px;color:var(--ink-3);line-height:1.5;min-height:37px}
  .bc-a{font-size:13.5px;font-weight:600;margin:7px 0 9px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
  .chip.lean{color:var(--series-1);background:var(--tint-1)}
  .chip.attach{color:var(--series-2);background:var(--tint-orange)}
  .legend{display:flex;gap:18px;font-size:12px;color:var(--ink-2);margin-bottom:14px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cmp-card{position:relative;overflow:hidden;background:var(--page-2);border:1px solid var(--hairline);border-radius:14px;padding:18px}
  .cmp-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--acc)}
  .cmp-name{font-size:14.5px;font-weight:700}
  .cmp-tag{font-size:11.5px;color:var(--ink-3);margin:2px 0 12px}
  .cmp-num{font-size:27px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;margin-bottom:10px}
  .cmp-bar{height:8px;border-radius:4px;background:var(--hairline);overflow:hidden;margin-bottom:10px}
  .cmp-bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
  .cmp-note{font-size:11.5px;color:var(--ink-3);line-height:1.6}
  .diff-hero{text-align:center;background:var(--tint-1);border:1px solid var(--hairline);border-radius:14px;padding:18px;margin-top:14px}
  .diff-cap{font-size:12.5px;color:var(--ink-2)}
  .diff-num{font-size:34px;font-weight:800;color:var(--series-1);font-variant-numeric:tabular-nums;margin:5px 0 2px}
  .diff-sub{font-size:12px;color:var(--ink-3)}
  .table-wrap{overflow-x:auto;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:430px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--hairline);text-align:left}
  th{color:var(--ink-2);font-weight:600;font-size:12.5px}
  td:last-child,td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  td .minor{font-weight:400;font-size:11.5px;color:var(--ink-3)}
  ul.paths{margin:4px 0 0}
  ul.paths li{margin:9px 0 9px 2px;font-size:14px;list-style:none;padding-left:24px;position:relative}
  ul.paths li::before{content:"✓";position:absolute;left:0;top:0;color:var(--st-good);font-weight:700}
  .risk{display:flex;gap:12px;align-items:flex-start;background:var(--page-2);border:1px solid var(--hairline);border-left:4px solid var(--rv);border-radius:12px;padding:13px 16px;margin:10px 0}
  .lv{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 12px;color:var(--ink-1);background:var(--lvbg);flex-shrink:0;margin-top:1px}
  .lv i{width:8px;height:8px;border-radius:50%;background:var(--rv)}
  .risk .bd{font-size:13px;color:var(--ink-2);line-height:1.65}
  .risk .bd b{display:block;font-size:14.5px;color:var(--ink-1);margin-bottom:2px}
  .redline{border:1.5px solid var(--st-crit);border-radius:14px;padding:16px 18px;margin-bottom:12px;background:var(--tint-crit)}
  .redline h4{color:var(--st-crit);font-size:14px;margin-bottom:5px}
  .redline p{font-size:13px;color:var(--ink-2);line-height:1.65}
  .policy{font-size:11.5px;color:var(--ink-3);margin:20px 0 0;line-height:1.7}
  .actions{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap}
  /* ---------- 页脚 ---------- */
  footer.foot{border-top:1px solid var(--hairline);background:var(--page-2);padding:14px 20px;font-size:12px;color:var(--ink-3);text-align:center;line-height:1.7}
  /* ---------- 响应式 ---------- */
  @media (max-width:900px){
    .grid{grid-template-columns:1fr 1fr}
    .policy-strip{grid-template-columns:1fr 1fr}
  }
  @media (max-width:640px){
    .hero{padding:46px 18px 40px}
    .hero h1{font-size:27px}
    .stats{grid-template-columns:1fr}
    .steps-h{grid-template-columns:1fr 1fr}
    .grid{grid-template-columns:1fr}
    .policy-strip{grid-template-columns:1fr}
    .fields2{grid-template-columns:1fr}
    .cmp-grid{grid-template-columns:1fr}
    .card{padding:22px 16px}
    .question{font-size:18px}
    .band{padding:34px 16px}
    .vcard-body{padding:16px}
    .page-pad{padding:20px 14px 56px}
  }
  @media print{
    .no-print,header.topbar,.hero,.band-dark,footer.foot{display:none!important}
    body{background:#fff;color:#000}
    .card,.vcard,.verdict{box-shadow:none;border-color:#999}
    .vcard-head{background:#eee}
    .note,.risk,.basis-card,.cmp-card{background:#f6f6f6;border-color:#ccc}
    .band,.band-tint{background:#fff;padding:16px 0}
    .page-pad{padding:0}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">税</div>
    <div class="brand">平台报税向导<small>Platform Tax Guide</small></div>
  </div>
</header>
<main id="app"></main>
<footer class="foot">
  免责声明：本工具提供一般性测算与政策提示，不构成税务咨询意见；具体申报请以主管税务机关口径及申报时现行政策为准。预置演示案例及其数据均为模拟数据。
</footer>
<script>
"use strict";
/* ==================== 题库与案例（模拟数据） ==================== */
const QUESTIONS = [

/* ==================== 计算引擎 ==================== */
const COMP = [[36000,.03,0],[144000,.10,2520],[300000,.20,16920],[420000,.25,31920],[660000,.30,52920],[960000,.35,85920],[Infinity,.45,181920]];
const BIZ  = [[30000,.05,0],[90000,.10,1500],[300000,.20,10500],[500000,.30,40500],[Infinity,.35,65500]];
function taxOf(x, table){ for(const [up,rate,qd] of table){ if(x<=up) return x*rate-qd; } return 0; }
function calcLabor(income){
  const net = income*0.8;
  const taxable = Math.max(0, net-60000);
  return {net:Math.round(net), taxable:Math.round(taxable), tax:Math.round(taxOf(taxable,COMP))};
}
function calcBiz(income, costs){
  const taxable = Math.max(0, income-costs);
  const gross = taxOf(taxable,BIZ);
  const relief = 0.5*taxOf(Math.min(taxable,2000000),BIZ); /* 2023年12号公告：≤200万部分减半 */
  return {taxable:Math.round(taxable), tax:Math.round(gross-relief), relief:Math.round(relief)};
}
function calcVAT(income){ /* 小规模：月10万（含）以下免征 */
  const monthly = income/12;
  if(monthly<=100000) return {vat:0, sur:0, exempt:true};
  const vat = income/1.01*0.01;
  const sur = vat*(0.07+0.03+0.02)*0.5;
  return {vat:Math.round(vat), sur:Math.round(sur), exempt:false};
}
const fmt = n => n.toLocaleString("zh-CN") + " 元";

/* ==================== 判定引擎 ==================== */
function judge(ans){
  if(ans.q1==="是") return "wage";
  if(ans.q2==="是") return "convenience";
  if(ans.q3==="是") return "business";
  const n = ["q4","q5","q6","q7","q8"].filter(k => ans[k]===LEAN[k]).length;
  return n>=3 ? "deFacto" : "labor";
}
function basisList(ans){
  return ["q4","q5","q6","q7","q8"].map(k=>{
    const q = QUESTIONS.find(x=>x.id===k);
    const lean = ans[k]===LEAN[k];
    return {q:q.t.replace(/？$/,""), a:ans[k], lean:lean};
  });
}

function show(fn){
  let out;
  try{ out = fn(); }
  catch(e){
    out = `<div class="page-pad"><div class="page-col"><div class="card"><div class="data-head"><span class="sec-ico">⚠️</span><div><h2>页面渲染出错</h2><p class="data-sub">${String(e&&e.message||e)}</p></div></div><button class="btn" onclick="goHome()">返回首页</button></div></div></div>`;
  }
  $app.innerHTML = out;
  window.scrollTo(0,0);
}
function render(){
  show(SCREENS[current]);
  /* 同步 URL hash：同一屏内换题不产生新历史，换屏才产生——浏览器返回键 = 应用内退一步 */
  try{
    if(location.hash !== undefined){
      const h = "#" + current;
      if(location.hash !== h) location.hash = h;
    }
  }catch(e){}
}

/* ---------- 开始入口 ---------- */
function startCase(id){
  const c = CASES.find(x=>x.id===id);
  state.caseId = id; state.ans = {...c.ans}; state.flags = [...c.flags];
  state.income = c.income; state.costs = c.costs; state.main = c.main;
  const t = judge(state.ans);
  if(t==="wage"){ current="result"; render(); return; }
  if(t==="convenience"){ current="data"; render(); return; }
  qi = 0; current="quiz"; render();
}
function startManual(){
  state.caseId = null; state.ans = {}; state.flags = [];
  state.income = null; state.costs = null; state.main = 0;
  qi = 0; current="quiz"; render();
}

  return `<div class="case-banner">演示案例：<b>${c.name}</b><a onclick="goHome()">退出案例</a></div>`;
}
function renderQuiz(){
  const id = quizFlow[qi];
  const q = QUESTIONS.find(x=>x.id===id);
  const pct = Math.round((qi+1)/quizFlow.length*100);
  const tagCls = q.tag==="经营实质" ? "tag-orange" : "tag-blue";
  const opts = q.o.map((o,i)=>`
    <button class="opt ${state.ans[id]===o?"sel":""}" onclick="pick('${id}','${o}')">
      <span class="key">${String.fromCharCode(65+i)}</span>
      <span class="txt">${o}</span>
      <span class="ck">✓</span>
    </button>`).join("");
  return `
  <div class="page-pad">
    <div class="page-col">
      ${caseBanner()}
      <div class="q-head">
        <span class="q-count">第 ${qi+1} / ${quizFlow.length} 题</span>
        <div class="pbar"><i style="width:${pct}%"></i></div>
        <span class="q-pct">${pct}%</span>
      </div>
      <div class="card">
        <span class="tag ${tagCls}">${q.tag}</span>
        <div class="question">${q.t}</div>
        <div class="q-tip">💡 结合你与平台、机构的真实合作模式作答</div>
        <div class="opts">${opts}</div>
        <div class="nav">
          <button class="btn ghost" onclick="prevQ()">上一题</button>
          <div class="spacer"></div>
          <button class="btn" ${state.ans[id]?"":"disabled"} onclick="nextQ()">下一题</button>
        </div>
      </div>
    </div>
  </div>`;
}
function pick(id,o){ state.ans[id]=o; render(); }
function nextQ(){
  qi++;
  const t = judge(state.ans);
  if(t==="wage"){ current="result"; render(); return; }
  if(t==="convenience"){ current="data"; render(); return; }
  if(qi>=quizFlow.length){ current="data"; render(); return; }
  render();
}
function prevQ(){
  if(qi>0){ qi--; render(); return; }
  goHome();
}
function backFromData(){
  const t = judge(state.ans);
  if(t==="wage"){ qi=0; current="quiz"; render(); return; }
  if(t==="convenience"){ qi=1; current="quiz"; render(); return; }
  qi = Math.min(qi, quizFlow.length-1);
  current="quiz"; render();
}
function goHome(){ state.ans={}; current="home"; render(); }
function goData(){ current="data"; render(); }

          <div class="table-wrap"><table>
            <tr><th>项目</th><th class="num">金额</th></tr>
            <tr><td>收入额（扣除 20% 费用）</td><td class="num">${fmt(lab.net)}</td></tr>
            <tr><td>减除基本费用后应纳税所得额</td><td class="num">${fmt(lab.taxable)}</td></tr>
            <tr><td>年度个税（简化估算）</td><td class="num">${fmt(lab.tax)}</td></tr>
          </table></div>
          <div class="note">劳务报酬路径的增值税以平台/支付方扣缴记录为准，本工具不单独测算。</div>
        </div>
      </div>
      <div class="vcard">
        <div class="vcard-head"><span class="vcard-num">03</span><h2><span class="h2-ico">⚠️</span>风险提示</h2></div>
        <div class="vcard-body">
          ${riskItems([
            ["good","豁免报送","你的活动属于便民劳务，平台无需报送你的收入信息（《报送规定》第四条）——但豁免的是报送义务，不是纳税义务。"],
            ["warn","口径差异","平台已代扣的，以扣缴记录为准；自担车辆/耗材等成本能否扣除存在口径差异，以主管税务机关口径为准。"]
          ])}
        </div>
      </div>
      <div class="policy">政策依据：《互联网平台企业涉税信息报送规定》（2025 年 6 月公布）；《个人所得税法》及实施条例。</div>
      ${printActions()}
    </div>
  </div>`;
}

function resultDual(t){
  const bizPrimary = (t==="business" || t==="deFacto");
  const lab = calcLabor(state.income);
  const biz = calcBiz(state.income, state.costs);
  const vat = calcVAT(state.income);
  const labTotal = lab.tax;
  const bizTotal = biz.tax + vat.vat + vat.sur;
  const diff = Math.abs(labTotal - bizTotal);
  const lower = labTotal < bizTotal ? "劳务报酬路径" : "经营所得路径";
  const max = Math.max(labTotal, bizTotal, 1);

  const verdict = {
    business:["已登记主体经营 → 经营所得","你已办理个体工商户/个人独资企业登记并以该主体名义经营，收入按经营所得申报（本工具按查账征收口径测算）。"],
    deFacto:["实质经营所得 · 尚未登记","你的经营实质特征明显（自备投入、自负盈亏、持续经营、面向市场），但未办理市场主体登记——这是当前最大的合规缺口，建议尽快补办登记后按经营所得申报。"],
    labor:["依附平台模式 → 劳务报酬所得","你的经营实质特征不足（平台定价、按单计酬、无自有投入、收入依附单一平台），收入按劳务报酬处理，年度并入综合所得汇算清缴。"]
  }[t];

  const basis = basisList(state.ans).map(b=>`
    <div class="basis-card">
      <div class="bc-q">${b.q}</div>
      <div class="bc-a">答「${b.a}」</div>
      <span class="chip ${b.lean?"lean":"attach"}">${b.lean?"经营倾向":"依附倾向"}</span>
    </div>`).join("");

  const paths = {
    business:[
      "按经营所得查账征收申报，年度汇算清缴于次年 3 月 31 日前完成；",
      "以主体名义自开数电票，规范开票品目；",
      "留存采购、成本、费用凭证——2026 年一季度平台内小规模纳税人向上游取票金额已同比增长 48%，不开票压价正在被淘汰。"
    ],
    deFacto:[
      "尽快办理个体工商户登记（线上申请，一般数日办结），以主体名义对外经营；",
      "登记后按经营所得查账征收申报，年度汇算清缴于次年 3 月 31 日前完成；",
      "自开数电票、留存成本凭证，建立收入成本流水账。"
    ],
    labor:[
      "核对平台/支付方预扣个税记录（劳务报酬按次预扣 20%/30%/40%）；",
      "年度并入综合所得汇算清缴（次年 3 月 1 日至 6 月 30 日）；",
      "若实际经营实质趋近自主经营，可评估办理个体户登记后按经营所得申报。"
    ]
  }[t];

  const risks = [];
  if(t==="deFacto") risks.push(["crit","未登记经营","未办理登记即持续从事经营活动，存在被责令限期登记及征管风险；建议尽快补办。"]);
  if(state.flags.includes("fakeOrder")) risks.push(["crit","刷单流水","刷单属于虚假交易，不构成应税收入，不应申报；请剔除刷单流水并留存证据（平台规则、资金往来记录）。"]);
  if(state.flags.includes("multiAccount")) risks.push(["serious","一人多号","一人注册多个主体分摊收入属于「分拆收入」，是当前稽查重点打击行为；请合并申报。"]);
  if(bizPrimary) risks.push(["warn","核定征收提示","网络宣传的「1% 核定」多为误导；当地是否可核定以主管税务机关口径为准，本工具仅测算查账征收口径。"]);
  risks.push(["warn","凭证不足","成本费用无合规凭证将影响税前扣除；请向上游索取发票并留存。"]);

  const mainNote = state.main>0 ? `
    <div class="note"><b>两处以上所得提示：</b>你另有主业年收入 ${fmt(state.main)}。根据《个人所得税法实施条例》第二十五条，从两处以上取得综合所得且年收入额减除专项扣除后超过 6 万元的，需要办理年度汇算清缴。${bizPrimary?"经营所得与综合所得分别计税、分别申报。":"平台收入应并入综合所得申报。"}</div>` : "";

  return `
  <div class="page-pad">
    <div class="page-col">
      ${caseBanner()}
      <div class="rpt-head">
        <div class="data-head"><span class="sec-ico">📋</span><div><h2>你的合规申报报告</h2><p class="data-sub">基于你的作答与数据生成 · 简化估算</p></div></div>
      </div>
      <div class="verdict" style="--vc:${TONES[t][0]};--vbg:${TONES[t][1]}">
        <span class="v-ico">${TONE_ICO[t]}</span>
        <div>
          <h3>${verdict[0]}</h3>
          <p>${verdict[1]}</p>
        </div>
      </div>
      ${(state.flags.includes("live") || !state.caseId) ? `<div class="note">直播提示：网络主播以个人名义取得的分成，多数情形按劳务报酬处理；以登记主体（工作室）名义签约并按经营实质运营的，按经营所得处理（税务所得发〔2022〕25 号口径）。</div>` : ""}
      <div class="vcard">
        <div class="vcard-head"><span class="vcard-num">01</span><h2><span class="h2-ico">🧾</span>判定依据</h2></div>
        <div class="vcard-body"><div class="basis-grid">${basis}</div></div>
      </div>
      <div class="vcard">
        <div class="vcard-head"><span class="vcard-num">02</span><h2><span class="h2-ico">📊</span>双路径税负对比（年度）</h2></div>
        <div class="vcard-body">
          <div class="legend">
            <span><i style="background:var(--series-1)"></i>经营所得路径（个体户查账，含减半优惠）</span>
            <span><i style="background:var(--series-2)"></i>劳务报酬路径（并入综合所得）</span>
          </div>
          <div class="cmp-grid">
            <div class="cmp-card" style="--acc:var(--series-1)">
              <div class="cmp-name">经营所得路径</div>
              <div class="cmp-tag">个体户查账 · 含 ≤200 万减半</div>
              <div class="cmp-num">${fmt(bizTotal)}</div>
              <div class="cmp-bar"><i style="width:${bizTotal/max*100}%;background:var(--acc)"></i></div>
              <div class="cmp-note">个税 ${fmt(biz.tax)} · 增值税 ${vat.exempt?"免征":fmt(vat.vat)} · 附加 ${vat.sur?fmt(vat.sur):"0 元"}</div>
            </div>
            <div class="cmp-card" style="--acc:var(--series-2)">
              <div class="cmp-name">劳务报酬路径</div>
              <div class="cmp-tag">并入综合所得汇算</div>
              <div class="cmp-num">${fmt(labTotal)}</div>
              <div class="cmp-bar"><i style="width:${labTotal/max*100}%;background:var(--acc)"></i></div>
              <div class="cmp-note">个税 ${fmt(lab.tax)} · 增值税以扣缴记录为准</div>
            </div>
          </div>
          <div class="diff-hero">
            <div class="diff-cap">两路径年度税负差额（较低者为「${lower}」）</div>
            <div class="diff-num">${fmt(diff)}</div>
            <div class="diff-sub">正确判定收入性质、选择合规申报路径，差别一目了然</div>
          </div>
        </div>
      </div>
      <div class="vcard">
        <div class="vcard-head"><span class="vcard-num">03</span><h2><span class="h2-ico">🧮</span>测算明细</h2></div>
        <div class="vcard-body">
          <div class="table-wrap"><table>
            <tr><th>项目</th><th class="num">经营所得路径</th><th class="num">劳务报酬路径</th></tr>
            <tr><td>计税基础</td><td class="num">应税所得 ${fmt(biz.taxable)}</td><td class="num">收入额 ${fmt(lab.net)}</td></tr>
            <tr><td>个税</td><td class="num">${fmt(biz.tax)}<div class="minor">含 ≤200 万部分减半优惠 ${fmt(biz.relief)}</div></td><td class="num">${fmt(lab.tax)}</td></tr>
            <tr><td>增值税</td><td class="num">${vat.exempt?"免征<span class='minor' style='display:block'>月均未超 10 万</span>":fmt(vat.vat)}</td><td class="num" style="color:var(--ink-3)">以扣缴记录为准</td></tr>
            <tr><td>附加税费</td><td class="num">${vat.sur?fmt(vat.sur):"0 元"}</td><td class="num" style="color:var(--ink-3)">—</td></tr>
            <tr><td>合计</td><td class="num">${fmt(bizTotal)}</td><td class="num">${fmt(labTotal)}</td></tr>
          </table></div>
        </div>
      </div>
      <div class="vcard">
        <div class="vcard-head"><span class="vcard-num">04</span><h2><span class="h2-ico">🗺️</span>合规申报路径</h2></div>
        <div class="vcard-body">
          <ul class="paths">${paths.map(p=>`<li>${p}</li>`).join("")}</ul>
          ${mainNote}
        </div>
      </div>
      <div class="vcard">
        <div class="vcard-head"><span class="vcard-num">05</span><h2><span class="h2-ico">⚠️</span>风险提示</h2></div>
        <div class="vcard-body">${riskItems(risks)}</div>
      </div>
      <div class="policy">政策依据：《互联网平台企业涉税信息报送规定》；《个人所得税法》及实施条例第二十五条；财政部 税务总局公告 2023 年第 12 号、第 19 号、2026 年第 10 号；财政部 税务总局公告 2021 年第 41 号；税务所得发〔2022〕25 号。</div>
      ${printActions()}
    </div>
  </div>`;
}

function riskItems(items){
  const colors = {good:"var(--st-good)",warn:"var(--st-warn)",serious:"var(--st-serious)",crit:"var(--st-crit)"};
  const tints  = {good:"var(--tint-good)",warn:"var(--tint-warn)",serious:"var(--tint-serious)",crit:"var(--tint-crit)"};
  const labels = {good:"低",warn:"中",serious:"高",crit:"红线"};
  const body = items.map(([lv,title,desc])=>`
    <div class="risk" style="--rv:${colors[lv]};--lvbg:${tints[lv]}">
      <span class="lv"><i></i>${labels[lv]}</span>
      <span class="bd"><b>${title}</b>${desc}</span>
    </div>`).join("");
  return `
  <div class="redline"><h4>⛔ 本工具不提供</h4>
    <p>如何隐匿收入、如何一人多户分拆收入、如何将劳务报酬「转换」为经营所得避税、如何虚假核定或利用洼地注册——任何逃避纳税义务的方案，本工具一概不回答。</p>
  </div>${body}`;
}

function printActions(){
  return `
  <div class="actions no-print">
    <button class="btn" onclick="window.print()">打印 / 导出报告</button>
    <button class="btn ghost" onclick="current='data';render()">修改数据</button>
    <button class="btn ghost" onclick="startManual()">重新测算</button>
  </div>`;
}

/* ==================== 浏览器返回键（hash 路由） ==================== */
if(window.addEventListener && location.hash !== undefined){
  /* 刷新带旧 hash 时清掉（状态不持久化，从头开始） */
  if(location.hash){
    try{ if(history && history.replaceState) history.replaceState(null, "", location.pathname + location.search); else location.hash = ""; }catch(e){}
  }
  window.addEventListener("hashchange", function(){
    const h = (location.hash || "").replace("#","");
    if(h && SCREENS[h] && h !== current){
      if(h === "quiz") qi = Math.min(qi, quizFlow.length - 1); /* 答完 8 题后 qi=8，回问询页需钳制到最后一道题 */
      current = h; render();
    }
    else if(!h && current !== "home"){ current = "home"; render(); }
  });
}

/* ==================== 启动 ==================== */
render();
</script>
</body>
</html>
